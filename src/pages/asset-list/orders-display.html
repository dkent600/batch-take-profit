<template>
  <!-- ***** OPEN ORDERS SECTION ***** -->
  <div>
    <h2 class="text-2xl font-bold text-center">Open Orders</h2>
    <div if.bind="openOrders.size === 0" class="text-center text-gray-500 mt-2">
      No open orders found
    </div>
    <table else class="fast-table fast-table-zebra fast-table-auto w-fit mx-auto">
      <thead>
        <tr>
          <th class="text-left text-sm px-2">Created</th>
          <th class="text-left text-sm px-2">Exchange</th>
          <th class="text-left text-sm px-2">Direction</th>
          <th class="text-left text-sm px-2">Pair</th>
          <th class="text-left text-sm px-2">Price</th>
          <th class="text-left text-sm px-2">Amount</th>
          <th class="text-left text-sm px-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="order of ordersStore.openOrders">
          <td class="text-left text-sm px-2">
            ${ new Date(order.createdAt).toLocaleString() }
          </td>
          <td class="text-left text-sm px-2">
            ${order.exchange}
          </td>
          <td class="text-left text-sm px-2">
            ${order.direction}
          </td>
          <td class="text-left text-sm px-2">
            ${order.pair}
          </td>
          <td class="text-left text-sm px-2">
            ${order.price}
          </td>
          <td class="text-left text-sm px-2">
            ${order.amount}
          </td>
          <td class="text-left text-sm px-2">
            <fast-anchor
              click.trigger="cancelOrder(order.orderId)"
              class="justify-center fast-link fast-link-primary text-sm no-underline">
              Cancel
            </fast-anchor>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- ***** CLOSED ORDERS SECTION ***** -->
  <fast-accordion class="fast-accordion-section my-4 max-w-fit mx-auto">
    <fast-accordion-item>
      <h3 slot="heading" class="text-2xl font-bold text-center">
        Closed Orders
      </h3>
      <div slot="content">
        <table class="fast-table fast-table-zebra fast-table-auto w-fit mx-auto">
          <thead>
            <tr>
              <th class="text-left text-sm px-2">Created</th>
              <th class="text-left text-sm px-2">Closed</th>
              <th class="text-left text-sm px-2">Exchange</th>
              <th class="text-left text-sm px-2">Pair</th>
              <th class="text-left text-sm px-2">Type</th>
              <th class="text-left text-sm px-2">Status</th>
              <th class="text-left text-sm px-2">Coins</th>
              <th class="text-left text-sm px-2">Executed Price</th>
              <th class="text-left text-sm px-2">Limit price</th>
              <th class="text-left text-sm px-2">Total Cost</th>
            </tr>
          </thead>
          <tbody>
            <tr repeat.for="order of ordersStore.closedOrders">
              <td class="text-left text-sm px-2">
                ${ new Date(order.createdAt).toLocaleString() }
              </td>
              <td class="text-left text-sm px-2">
                ${ new Date(order.closedAt).toLocaleString() }
              </td>
              <td class="text-left text-sm px-2">
                ${order.exchange}
              </td>
              <td class="text-left text-sm px-2">
                ${order.pair}
              </td>
              <td class="text-left text-sm px-2">
                ${order.direction + (order.type === 'limit' ? ' (limit)' : ' (market)')}
              </td>
              <td class="text-left text-sm px-2">
                 ${order.status }
              </td>
              <td class="text-left text-sm px-2">
                 ${order.status === 'executed' ? order.amountExecuted : order.amount }
              </td>
              <td class="text-left text-sm px-2">
                <!-- 'closed' means executed. order.price will be the executed price -->
                 ${order.status === 'executed' ? order.price : '' }
              </td>
              <td class="text-left text-sm px-2">
                 ${order.type === 'limit' ? order.limitPrice : '' }
              </td>
              <td class="text-left text-sm px-2">
                 ${order.status === 'executed' ? order.cost : '' }
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </fast-accordion-item>
  </fast-accordion>
</template>
