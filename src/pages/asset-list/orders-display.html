<template>
<fluent-button 
appearance="accent"
class="tw-[--accent-base-color:#4a7a49] tw-[--base-layer-luminance:0.1]">
  Brand Accent
</fluent-button>

<fluent-button appearance="accent"
  style="--accent-fill-rest:#4a7a49; --accent-fill-hover:#3a6139; --accent-fill-active:#2d4a2c">
  Brand Accent II
</fluent-button>

<fluent-button appearance="accent"
  class="tw-[--accent-fill-rest:#4a7a49] tw-[--accent-fill-hover:#3a6139] tw-[--accent-fill-active:#2d4a2c]">
  Brand Accent TW
</fluent-button>

<fluent-button appearance="accent"
  style="
    --accent-fill-rest:#4a7a49;
    --accent-fill-hover:#3a6139;
    --accent-fill-active:#2d4a2c;
    --foreground-on-accent:#ffffff;">
  Brand Accent
</fluent-button>


<div class="tw-my-4 tw-max-w-fit tw-mx-auto">
  <fluent-accordion>
      <!-- ***** OPEN ORDERS SECTION ***** -->
      <fluent-accordion-item expanded>
        <div slot="heading" 
          class="tw-text-2xl tw-font-bold tw-text-center tw-py-2">
          Open Orders (${openedOrders.length})
        </div>
        <div class="tw-p-4">
          <div class="tw-grid tw-place-items-center tw-h-8 tw-w-8 tw-mx-auto">
            <icon-button
              if.bind="!fetchingOpenedOrders"
              click.trigger="fetchOpenedOrders" 
              title="Refresh"
              ariaLabel="Refresh">
              <span slot="icon">↻</span>
              <!-- <span slot="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm9 3-.93-.34a7.5 7.5 0 0 0-.6-1.44l.55-.8a1 1 0 0 0-.1-1.24l-1.5-1.5a1 1 0 0 0-1.24-.1l-.8.55c-.47-.22-.96-.41-1.47-.55L14.5 4a1 1 0 0 0-1-.8h-2a1 1 0 0 0-1 .8l-.34.93c-.5.14-1 .33-1.47.55l-.8-.55a1 1 0 0 0-1.24.1L3.15 6.53a1 1 0 0 0-.1 1.24l.55.8c-.23.47-.42.96-.56 1.47L2 12a1 1 0 0 0 .8 1l.93.34c.14.5.33 1 .55 1.47l-.55.8a1 1 0 0 0 .1 1.24l1.5 1.5a1 1 0 0 0 1.24.1l.8-.55c.47.23.96.41 1.47.56L10 22a1 1 0 0 0 1 .8h2a1 1 0 0 0 1-.8l.34-.93c.5-.14 1-.33 1.47-.56l.8.55a1 1 0 0 0 1.24-.1l1.5-1.5a1 1 0 0 0 .1-1.24l-.55-.8c.23-.47.42-.96.56-1.47L22 13a1 1 0 0 0-.8-1Z"/>
              </svg></span> -->
            </icon-button>
            <fluent-progress-ring 
              if.bind="fetchingOpenedOrders"
              style="--design-unit: 1; width: 32px; height: 32px;">
            </fluent-progress-ring>
          </div>
          <table-grid 
            class="tw-w-fit tw-mx-auto"
            show-empty-state.bind="openedOrders.length === 0" 
            loading.bind="fetchingOpenedOrders" 
            empty-message="No open orders found">
            <table-grid-row type="header">
              <table-grid-cell cell-type="columnheader">Created</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Exchange</table-grid-cell>
              <table-grid-cell cell-type="columnheader" align="center">Direction</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Pair</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Price</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Amount</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Value</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Actions</table-grid-cell>
            </table-grid-row>
            <table-grid-row repeat.for="order of openedOrders">
              <table-grid-cell>${order.createdAt}</table-grid-cell>
              <table-grid-cell>${order.exchange}</table-grid-cell>
              <table-grid-cell align="center">${order.direction}</table-grid-cell>
              <table-grid-cell>${order.pair}</table-grid-cell>
              <table-grid-cell>${order.price}</table-grid-cell>
              <table-grid-cell>${order.amount}</table-grid-cell>
              <table-grid-cell>${order.amount * order.price}</table-grid-cell>
              <table-grid-cell>
                <fluent-button 
                  appearance="stealth" 
                  size="small"
                  click.trigger="cancelOrder(order.orderId)">
                  Cancel
                </fluent-button>
              </table-grid-cell>
            </table-grid-row>
          </table-grid>
        </div>
      </fluent-accordion-item>

      <!-- ***** CLOSED ORDERS SECTION ***** -->
      <fluent-accordion-item>
        <div slot="heading" class="tw-text-2xl tw-font-bold tw-text-center tw-py-2">
          Closed Orders
        </div>
        <div class="tw-p-4">
          <table-grid 
            class="tw-w-fit tw-mx-auto"
            show-empty-state.bind="closedOrders.length === 0" 
            loading.bind="fetchingClosedOrders" 
            empty-message="No closed orders found">
            <table-grid-row type="header">
              <table-grid-cell cell-type="columnheader">Created</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Closed</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Exchange</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Pair</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Type</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Status</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Coins</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Executed Price</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Limit Price</table-grid-cell>
              <table-grid-cell cell-type="columnheader">Total Cost</table-grid-cell>
            </table-grid-row>
            
            <table-grid-row repeat.for="order of closedOrders">
              <table-grid-cell>${order.createdAt}</table-grid-cell>
              <table-grid-cell>${order.closed}</table-grid-cell>
              <table-grid-cell>${order.exchange}</table-grid-cell>
              <table-grid-cell>${order.pair}</table-grid-cell>
              <table-grid-cell>${order.type}</table-grid-cell>
              <table-grid-cell>${order.status}</table-grid-cell>
              <table-grid-cell>${order.coins}</table-grid-cell>
              <table-grid-cell>${order.executedPrice}</table-grid-cell>
              <table-grid-cell>${order.limitPrice}</table-grid-cell>
              <table-grid-cell>${order.totalCost}</table-grid-cell>
            </table-grid-row>
          </table-grid>
        </div>
      </fluent-accordion-item>
    </fluent-accordion>
  </div>
</template>
