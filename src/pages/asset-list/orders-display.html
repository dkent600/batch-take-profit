<template>
  <!-- ***** OPEN ORDERS SECTION ***** -->
  <div>
    <h2 class="text-2xl font-bold text-center">Open Orders</h2>
    <div if.bind="ordersStore.openOrders.length === 0" class="text-center text-gray-500 mt-2">
      No open orders found
    </div>
    <fluent-data-grid else rows-data.bind="openOrdersData" class="w-fit mx-auto">
      <fluent-data-grid-row type="header">
        <fluent-data-grid-cell cell-type="columnheader" grid-column="1">Created</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="2">Exchange</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="3">Direction</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="4">Pair</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="5">Price</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="6">Amount</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="7">Actions</fluent-data-grid-cell>
      </fluent-data-grid-row>
      
      <fluent-data-grid-row repeat.for="order of ordersStore.openOrders">
        <fluent-data-grid-cell grid-column="1">${ new Date(order.createdAt).toLocaleString() }</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="2">${order.exchange}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="3">${order.direction}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="4">${order.pair}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="5">${order.price}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="6">${order.amount}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="7">
          <fluent-button 
            appearance="stealth" 
            size="small"
            click.trigger="cancelOrder(order.orderId)">
            Cancel
          </fluent-button>
        </fluent-data-grid-cell>
      </fluent-data-grid-row>
    </fluent-data-grid>
  </div>
  
  <!-- ***** CLOSED ORDERS SECTION ***** -->
  <div class="daisy-collapse daisy-collapse-arrow bg-base-200 my-4 max-w-fit mx-auto">
    <fluent-checkbox class="daisy-peer"></fluent-checkbox>
    <div class="daisy-collapse-title text-2xl font-bold text-center">
      Closed Orders
    </div>
    <div class="daisy-collapse-content">
      <fluent-data-grid rows-data.bind="closedOrdersData" class="w-fit mx-auto">
        <fluent-data-grid-row type="header">
          <fluent-data-grid-cell cell-type="columnheader" grid-column="1">Created</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="2">Closed</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="3">Exchange</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="4">Pair</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="5">Type</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="6">Status</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="7">Coins</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="8">Executed Price</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="9">Limit Price</fluent-data-grid-cell>
          <fluent-data-grid-cell cell-type="columnheader" grid-column="10">Total Cost</fluent-data-grid-cell>
        </fluent-data-grid-row>
        
        <fluent-data-grid-row repeat.for="order of ordersStore.closedOrders">
          <fluent-data-grid-cell grid-column="1">${ new Date(order.createdAt).toLocaleString() }</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="2">${ new Date(order.closedAt).toLocaleString() }</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="3">${order.exchange}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="4">${order.pair}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="5">${order.direction + (order.type === 'limit' ? ' (limit)' : ' (market)')}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="6">${order.status}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="7">${order.status === 'executed' ? order.amountExecuted : order.amount}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="8">${order.status === 'executed' ? order.price : ''}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="9">${order.type === 'limit' ? order.limitPrice : ''}</fluent-data-grid-cell>
          <fluent-data-grid-cell grid-column="10">${order.status === 'executed' ? order.cost : ''}</fluent-data-grid-cell>
        </fluent-data-grid-row>
      </fluent-data-grid>
    </div>
  </div>
</template>
