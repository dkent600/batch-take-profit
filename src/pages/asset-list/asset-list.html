<template>
  <div class="flex flex-col items-center gap-6 p-6">
    <h1 class="text-2xl font-bold text-center">Asset List</h1>

    <div class="overflow-x-auto w-full">
      <table class="daisy-table daisy-table-zebra daisy-table-auto w-fit mx-auto">
        <thead>
          <tr>
            <th class="text-left text-sm px-2">Coin</th>
            <th class="text-left text-sm px-2">Exchange</th>
            <th class="text-left text-sm px-2">% to Sell</th>
            <th class="text-left text-sm px-2"></th>
          </tr>
        </thead>
        <tbody>
          <tr repeat.for="asset of assets">
            <td class="text-left text-sm px-2">${asset.name}</td>
            <td class="text-left text-sm px-2">${asset.exchange}</td>
            <td class="text-left text-sm px-2">
                <input
                type="number"
                min="1"
                max="100"
                value.two-way="asset.percentage"
                required
                class.bind="'daisy-input daisy-input-xs w-16 text-center' + (asset.percentageInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
                input.trigger="validatePercentage(asset)"
                />%
            </td>
            <td class="text-left text-sm px-2">
                <button
                  style.bind="asset.percentageInvalid ? 'color: #6b7280;' : ''"
                  click.trigger="createSellOrder($event, asset)"
                  class.bind="'daisy-btn daisy-btn-outline daisy-btn-primary daisy-btn-xs' + (asset.percentageInvalid ? ' daisy-btn-disabled opacity-50 cursor-not-allowed' : '')"
                  disabled.bind="asset.percentageInvalid">
                  Place market sell order
                </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</template>
