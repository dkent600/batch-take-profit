<template>
  <div class="flex flex-col items-center p-6">
    <h1 class="text-2xl font-bold text-center">Scaled Take-Profit Sales</h1>
    <!-- ***** GRID SECTION ***** -->
    <table class="daisy-table daisy-table-zebra daisy-table-auto w-fit mx-auto">
      <thead>
        <tr>
          <th class="text-left text-sm px-2">Select</th>
          <th class="text-left text-sm px-2">Coins to Sell</th>
          <th class="text-left text-sm px-2">Exchange</th>
          <th class="text-left text-sm px-2">Coin Total Balance</th>
          <th class="text-left text-sm px-2">Percent</th>
          <th class="text-left text-sm px-2">Sell This Many Coins</th>
          <th class="text-left text-sm px-2">$USD/Coin</th>
          <th if.bind="limitOrder" class="text-left text-sm px-2">Limit Price</th>
          <th class="text-left text-sm px-2">Total Sale in $USD</th>
          <!--th class="text-left text-sm px-2"></th-->
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="asset of assets">
          <td class="text-left text-sm px-2">
            <input type="checkbox" checked.bind="asset.selected" />
          </td>
          <td class="text-left text-sm px-2">${asset.name}</td>
          <td class="text-left text-sm px-2">${asset.exchange}</td>
          <td class="text-left text-sm px-2">${asset.balance}</td>
          <td class="text-left text-sm px-2">
              <input
              if.bind="!useAmount"
              type="number"
              min="1"
              max="100"
              value.two-way="asset.percentage"
              required
              class.bind="'daisy-input daisy-input-xs w-16 text-center' + (asset.percentageInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
              input.trigger="validatePercentage(asset)"
              />
              <div else>${asset.percentage}</div>
              <div if.bind="asset.percentageInvalid" class="text-red-500 text-xs mt-1">Invalid percentage</div>
          </td>
          <td class="text-left text-sm px-2">
              <input
              if.bind="useAmount"
              type="number"
              min="0"
              value.two-way="asset.amount"
              required
              class.bind="'daisy-input daisy-input-xs w-32 text-center' + (asset.amountInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
              input.trigger="validateAmount(asset)"
              />
              <div else>${asset.amount}</div>
              <div if.bind="asset.amountInvalid" class="text-red-500 text-xs mt-1">Invalid amount</div>
          </td>
          <td class="text-left text-sm px-2">${asset.currentPrice}</td>
          <td class="text-left text-sm px-2" if.bind="limitOrder">
              <input
              type="number"
              min="0"
              value.two-way="asset.limitOrderPrice"
              required
              class.bind="'daisy-input daisy-input-xs w-32 text-center' + (asset.limitOrderPriceInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
              input.trigger="validateLimitOrderPrice(asset)"
              />
              <div if.bind="asset.limitOrderPriceInvalid" class="text-red-500 text-xs mt-1">Invalid limit order price</div>
          </td>
          <td class="text-left text-sm px-2">
              <div>
                ${(limitOrder ? asset.limitOrderPrice : asset.currentPrice) * asset.amount}
              </div>
          </td>
          <!--td class="text-left text-sm px-2">
            <button click.trigger="createSellOrder(asset)" class="daisy-btn daisy-btn-outline daisy-btn-primary daisy-btn-xs">
              Place market sell order
            </button>
          </td-->
        </tr>
      </tbody>
    </table>
      <!-- ***** BUTTON LINKS SECTION ***** -->
    <div class="flex flex-col items-center justify-center mt-4 gap-2">
      <div class="flex flex-row gap-4">
        <div
          click.trigger="selectAll()"
          class="justify-centerdaisy-link daisy-link-primary text-sm no-underline">
          Select All
        </div>
        <div
          click.trigger="selectNone()"
          class="justify-center daisy-link daisy-link-primary text-sm no-underline">
          Select None
        </div>
      </div>
      <div class="flex flex-row gap-4">
        <div
          click.trigger="toggleUseAmount()"
          class="justify-center daisy-link daisy-link-primary text-sm no-underline">
          <div>${useAmount ? 'Edit Percentage' : 'Sell This Many'}</div>
        </div>
      </div>
      <div class="flex flex-row gap-4">
        <div
          click.trigger="toggleLimitOrder()"
          class="flex justify-center whitespace-nowrap daisy-link daisy-link-primary text-sm no-underline w-36">
          <div>${limitOrder ? 'Switch to a Market Order' : 'Switch to a Limit Order'}</div>
        </div>
      </div>
      <div class="flex flex-row gap-4">
        <div
          click.trigger="refresh()"
          class="flex daisy-link justify-center daisy-link-primary text-sm no-underline">
            <span class="whitespace-nowrap">Refresh Prices and Balances</span>
            <span if.bind="isRefreshing" class="flex items-center justify-center h-full ml-1" style="margin-left: 4px;">
              <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </span>
        </div>
      </div>
      <div class="flex flex-row gap-4 py-2">
        <div
          click.trigger="createSellOrders()"
          class.bind="'flex daisy-btn daisy-btn-outline daisy-btn-primary daisy-btn-sm' + (!hasSelection || hasInvalidSelection ? ' daisy-btn-disabled opacity-50 cursor-not-allowed' : '')"
          disabled.bind="!hasSelection || hasInvalidSelection">
          Place the ${selectedOrders.length} selected ${limitOrder ? 'limit' : 'market'} sell order<template if.bind="selectedOrders.length != 1">s</template>
        </div>
      </div>
      <!-- ***** HELP MESSAGES SECTION ***** -->
      <div class="text-yellow-500 text-xs mt-1">Orders will be executed in terms of "Sell This Many Coins". Is best to round it, by editing it (click "Sell This Many").</div>
      <div class="text-yellow-500 text-xs mt-1">"$USD/Coin" is the current USD price of one coin. "Percent" is only to compute the default "Sell This Many Coins".</div>
      <div class="text-yellow-500 text-xs mt-1">Order history in Kraken can be found in KrakenPro => History => Spot & Margin => Orders, not in Kraken regular.</div>
    </div>
  </div>
  <!-- ***** OPEN ORDERS SECTION ***** -->
  <div>
    <h2 class="text-2xl font-bold text-center">Open Orders</h2>
    <div if.bind="openOrders.size === 0" class="text-center text-gray-500 mt-2">
      No open orders found
    </div>
    <table else class="daisy-table daisy-table-zebra daisy-table-auto w-fit mx-auto">
      <thead>
        <tr>
          <th class="text-left text-sm px-2">Pair</th>
          <th class="text-left text-sm px-2">Price</th>
          <th class="text-left text-sm px-2">Amount</th>
          <!-- th class="text-left text-sm px-2">txID</th-->
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="[key, order] of openOrders">
          <td class="text-left text-sm px-2">
            ${order.descr.pair}
          </td>
          <td class="text-left text-sm px-2">
            ${order.descr.price}
          </td>
          <td class="text-left text-sm px-2">
            ${order.vol}
          </td>
          <!--td class="text-left text-sm px-2">
            ${key}
          </td-->
          <td class="text-left text-sm px-2">
            <div
              click.trigger="cancelOrder(key)"
              class="justify-center daisy-link daisy-link-primary text-sm no-underline">
              Cancel
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- ***** CLOSED ORDERS SECTION ***** -->
  <div class="daisy-collapse daisy-collapse-arrow bg-base-200 my-4 max-w-fit mx-auto">
    <input type="checkbox" class="daisy-peer" />
    <div class="daisy-collapse-title text-2xl font-bold text-center">
      Closed Orders
    </div>
    <div class="daisy-collapse-content">
      <table class="daisy-table daisy-table-zebra daisy-table-auto w-fit mx-auto">
        <thead>
          <tr>
            <th class="text-left text-sm px-2">Pair</th>
            <th class="text-left text-sm px-2">Type</th>
            <th class="text-left text-sm px-2">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr repeat.for="[key, order] of closedOrders">
            <td class="text-left text-sm px-2">
              ${order.descr.pair}
            </td>
            <td class="text-left text-sm px-2">
              ${order.descr.type}
            </td>
            <td class="text-left text-sm px-2">
              ${order.status}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</template>
