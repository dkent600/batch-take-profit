<template>
<!-- Order Confirmation Modal Component -->
<div-- class="daisy-modal transition-opacity duration-200 ease-in-out" class.bind="isOpen ? 'daisy-modal-open' : ''" id="confirm-order-modal">
  <div class="daisy-modal-box max-w-2xl shadow-2xl">
    <h3 class="font-bold text-lg text-warning mb-4 flex items-center gap-2" if.bind="pendingOrder">
      <span class="text-2xl">🚨</span>
      Confirm ${pendingOrder.direction.toUpperCase()} Order
    </h3>
    
    <!-- High Value Warning -->
    <div class="daisy-alert daisy-alert-error mb-4 border-l-4 border-error shadow-lg" if.bind="pendingOrder && estimatedValue > 1000">
      <svg class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.728-.833-2.498 0L4.346 15.5c-.77.833.192 2.5 1.732 2.5z" />
      </svg>
      <div>
        <h4 class="font-bold text-lg">HIGH VALUE ORDER DETECTED</h4>
        <div class="text-sm opacity-90">Estimated value: $${estimatedValue.toFixed(2)}</div>
      </div>
    </div>

    <!-- Test Mode Warning -->
    <div class="daisy-alert daisy-alert-info mb-4 shadow-md" if.bind="pendingOrder && isTestMode">
      <svg class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <div>
        <h4 class="font-bold flex items-center gap-2">
          <span>🧪</span>
          TEST MODE ACTIVE
        </h4>
        <div class="text-sm opacity-90">This order will be validated but NOT executed. No real trading will occur.</div>
      </div>
    </div>
    
    <!-- Order Details -->
    <div class="py-4 space-y-4" if.bind="pendingOrder">
      <div class="grid grid-cols-2 gap-4 p-4 bg-base-200 rounded-lg shadow-inner">
        <div class="font-semibold text-base-content/70">Asset:</div>
        <div class="font-mono font-bold text-primary">${pendingOrder.name}</div>
        
        <div class="font-semibold text-base-content/70">Order Type:</div>
        <div>
          <span class="daisy-badge" class.bind="pendingOrder.limit ? 'daisy-badge-secondary' : 'daisy-badge-primary'">${pendingOrder.limit ? 'LIMIT' : 'MARKET'}</span>
        </div>
        
        <div class="font-semibold text-base-content/70">Amount:</div>
        <div class="font-mono">${pendingOrder.amount.toFixed(8)} ${pendingOrder.name}</div>
        
        <div class="font-semibold text-base-content/70" if.bind="pendingOrder.limit">Price:</div>
        <div class="font-mono" if.bind="pendingOrder.limit">${pendingOrder.LimitPrice} ${quoteCoin}</div>
        
        <div class="font-semibold text-base-content/70">Current Balance:</div>
        <div class="font-mono">${pendingOrder.balance.toFixed(8)} ${pendingOrder.name}</div>
        
        <div class="font-semibold text-base-content/70">Percentage:</div>
        <div class="font-mono">${pendingOrder.percentage.toFixed(2)}%</div>
        
        <div class="font-semibold text-base-content/70">
          ${pendingOrder.direction === 'sell' ? 'Estimated Revenue:' : 'Estimated Cost:'}
        </div>
        <div class="font-mono font-bold text-lg" class.bind="estimatedValue > 1000 ? 'text-error' : 'text-accent'">
          $${estimatedValue.toFixed(2)} ${quoteCoin}
        </div>
      </div>

      <!-- Safety Check Input for Large Orders (Approach #4) -->
      <div class="daisy-form-control space-y-2" if.bind="pendingOrder && estimatedValue > 5000">
        <div class="daisy-alert daisy-alert-warning shadow-md">
          <svg class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.728-.833-2.498 0L4.346 15.5c-.77.833.192 2.5 1.732 2.5z" />
          </svg>
          <div>
            <span class="font-bold text-sm">🔐 FINAL SAFETY CHECK</span>
            <div class="text-sm opacity-90">Type: <code class="bg-base-300 px-2 py-1 rounded font-mono">${confirmationText}</code></div>
          </div>
        </div>
        
        <input 
          type="text" 
          placeholder="Type the confirmation text exactly..." 
          class="daisy-input daisy-input-bordered daisy-input-lg font-mono text-center" 
          value.bind="safetyConfirmationInput"
          class.bind="safetyConfirmationInput === confirmationText ? 'safety-input-success' : 'safety-input-error'"
        />
        
        <div class="text-center" if.bind="safetyConfirmationInput && safetyConfirmationInput !== confirmationText">
          <span class="text-error text-sm font-medium">⚠️ Text does not match. Order will be cancelled.</span>
        </div>
        
        <div class="text-center" if.bind="safetyConfirmationInput === confirmationText && safetyConfirmationInput">
          <span class="text-success text-sm font-medium">✅ Safety check passed!</span>
        </div>
      </div>
      
      <div class="daisy-alert daisy-alert-warning shadow-md">
        <svg class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.728-.833-2.498 0L4.346 15.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
        <div>
          <span class="font-bold">This action cannot be undone!</span>
          <div class="text-sm opacity-90">Please verify all details carefully before proceeding.</div>
        </div>
      </div>
    </div>
    
    <div class="daisy-modal-action pt-6 gap-4">
      <button 
        class="daisy-btn daisy-btn-error daisy-btn-lg flex-1 transition-all duration-200 hover:scale-105 hover:shadow-lg disabled:hover:scale-100 disabled:hover:shadow-none" 
        click.trigger="executeOrder()"
        disabled.bind="pendingOrder && estimatedValue > 5000 && safetyConfirmationInput !== confirmationText"
      >
        <span class="text-xl">🚀</span>
        Execute ${pendingOrder ? pendingOrder.direction.toUpperCase() : ''} Order
      </button>
      <button class="daisy-btn daisy-btn-ghost daisy-btn-lg flex-1 transition-all duration-200 hover:scale-105" click.trigger="cancel()">
        <span class="text-xl">❌</span>
        Cancel
      </button>
    </div>
  </div>
</div>
</template>
