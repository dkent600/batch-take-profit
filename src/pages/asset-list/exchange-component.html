<template>
  <div class="flex flex-col items-center p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Buy and Sell by Percentage</h1>
    <!-- ***** GRID SECTION ***** -->
    <data-grid class="w-fit mx-auto">
      <fluent-data-grid-row type="header">
        <fluent-data-grid-cell cell-type="columnheader" grid-column="1">Select</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="2">Exchange</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="3">Coin</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="4">Balance</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="5">Buy/Sell</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="6">Percent</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="7">Coins to Buy/Sell</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="8">$USD/Coin</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="9">Limit</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="10">Limit Price</fluent-data-grid-cell>
        <fluent-data-grid-cell cell-type="columnheader" grid-column="11">Total Buy/Sell in $USD</fluent-data-grid-cell>
      </fluent-data-grid-row>
      
      <fluent-data-grid-row repeat.for="asset of assets">
        <fluent-data-grid-cell grid-column="1" style="text-align: center;">
          <fluent-checkbox checked.bind="asset.selected"></fluent-checkbox>
        </fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="2">${asset.exchange}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="3">${asset.name}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="4">${asset.balance}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="5">
          <fluent-select
            value.two-way="asset.direction"
            style="width: 6rem;">
            <fluent-option value="buy">Buy</fluent-option>
            <fluent-option value="sell">Sell</fluent-option>
          </fluent-select>
        </fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="6">
          <fluent-text-field
            if.bind="!useAmount"
            type="number"
            min="1"
            max="100"
            value.two-way="asset.percentage"
            required
            appearance.bind="asset.percentageInvalid ? 'error' : 'outline'"
            style="width: 4rem; text-align: center; font-size: 12px;"
            input.trigger="validatePercentage(asset)">
          </fluent-text-field>
          <div else>${asset.percentage}</div>
          <div if.bind="asset.percentageInvalid" class="text-red-500 text-xs mt-1">Invalid percentage</div>
        </fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="7">
          <fluent-text-field
            type="number"
            min="0"
            value.two-way="asset.amount"
            required
            appearance.bind="asset.amountInvalid ? 'error' : 'outline'"
            style="width: 8rem; text-align: center; font-size: 12px;"
            input.trigger="validateAmount(asset)">
          </fluent-text-field>
          <div if.bind="asset.amountInvalid" class="text-red-500 text-xs mt-1">Invalid amount</div>
        </fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="8">${asset.currentPrice}</fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="9" style="text-align: center;">
          <fluent-checkbox checked.bind="asset.limit"></fluent-checkbox>
        </fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="10">
          <fluent-text-field
            if.bind="asset.limit"
            type="number"
            min="0"
            value.two-way="asset.LimitPrice"
            required
            appearance.bind="asset.LimitPriceInvalid ? 'error' : 'outline'"
            style="width: 8rem; text-align: center; font-size: 12px;"
            input.trigger="validateLimitPrice(asset)">
          </fluent-text-field>
          <div else>---</div>
          <div if.bind="asset.LimitPriceInvalid" class="text-red-500 text-xs mt-1">Invalid limit order price</div>
        </fluent-data-grid-cell>
        <fluent-data-grid-cell grid-column="11">
          <div>
            ${(asset.limit ? asset.LimitPrice : asset.currentPrice) * asset.amount}
          </div>
        </fluent-data-grid-cell>
      </fluent-data-grid-row>
    </data-grid>
    
    <!-- ***** BUTTON LINKS SECTION ***** -->
    <div class="flex flex-col items-center justify-center mt-4 gap-2">
      <div class="flex flex-row gap-4">
        <div class="text-sm">Select 
          <fluent-button
            appearance="lightweight"
            click.trigger="selectAll()"
            style="padding: 0; min-width: auto; font-size: 14px; color: var(--accent-foreground-rest); text-decoration: underline;">All</fluent-button>
          |
          <fluent-button
            appearance="lightweight"
            click.trigger="selectNone()"
            style="padding: 0; min-width: auto; font-size: 14px; color: var(--accent-foreground-rest); text-decoration: underline;">None</fluent-button>
        </div>
      </div>
      <div class="flex flex-row gap-4">
        <fluent-button
          appearance="lightweight"
          click.trigger="refresh()"
          style="display: flex; justify-content: center; align-items: center; padding: 0; min-width: auto; font-size: 14px; color: var(--accent-foreground-rest); text-decoration: underline;">
            <span class="whitespace-nowrap">Refresh Prices and Balances</span>
            <span if.bind="isRefreshing" class="flex items-center justify-center h-full ml-1" style="margin-left: 4px;">
              <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </span>
        </fluent-button>
        </div>
      </div>
      <div class="flex flex-row gap-4 py-2">
        <fluent-button
          click.trigger="createOrders()"
          appearance="accent"
          disabled.bind="!hasSelection || hasInvalidSelection"
          style="display: flex; align-items: center; font-size: 14px;">
          Place the ${selectedOrders.length} selected order<template if.bind="selectedOrders.length != 1">s</template>
        </fluent-button>
      </div>
      <!-- ***** HELP MESSAGES SECTION ***** -->
      <div class="text-yellow-500 text-sm mt-1">Orders will be executed in terms of "Coins to Buy/Sell". Is best to round it, by editing it.</div>
      <div class="text-yellow-500 text-sm mt-1">"$USD/Coin" is the current USD price of one coin. "Percent" is only to compute the default "Coins to Buy/Sell".</div>
      <div class="text-yellow-500 text-sm mt-1">Order history in Kraken can be found in KrakenPro => Trade => Open Orders, not in Kraken regular.</div>
    </div>

    <!-- Order Confirmation Modal -->
    <order-confirmation-modal
      pending-order.bind="pendingOrder"
      quote-coin.bind="quoteCoin"
      on-execute.bind="executeConfirmedOrder.bind($this)"
      on-cancel.bind="cancelOrder.bind($this)">
    </order-confirmation-modal>
  </div>
</template>
