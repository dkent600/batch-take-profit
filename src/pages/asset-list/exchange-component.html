<template>
  <div class="flex flex-col items-center p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Scaled Take-Profit Sales</h1>
    <!-- ***** GRID SECTION ***** -->
    <table class="daisy-table daisy-table-zebra daisy-table-auto w-fit mx-auto">
      <thead>
        <tr>
          <th class="text-center text-sm px-2">Select</th>
          <th class="text-left text-sm px-2">Exchange</th>
          <th class="text-left text-sm px-2">Coin</th>
          <th class="text-left text-sm px-2">Balance</th>
          <th class="text-left text-sm px-2">Buy/Sell</th>
          <th class="text-left text-sm px-2">Percent</th>
          <th class="text-left text-sm px-2">Coins to Buy/Sell</th>
          <th class="text-left text-sm px-2">$USD/Coin</th>
          <th class="text-center text-sm px-2">Limit</th>
          <th class="text-left text-sm px-2">Limit Price</th>
          <th class="text-left text-sm px-2">Total Sale in $USD</th>
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="asset of assets">
          <td class="text-center text-sm px-2">
            <input type="checkbox" checked.bind="asset.selected" />
          </td>
          <td class="text-left text-sm px-2">${asset.exchange}</td>
          <td class="text-left text-sm px-2">${asset.name}</td>
          <td class="text-left text-sm px-2">${asset.balance}</td>
          <td class="text-left text-sm px-2">
            <select
              class="daisy-select daisy-select-xs w-24"
              value.two-way="asset.direction">
              <option value="buy">Buy</option>
              <option value="sell">Sell</option>
            </select>
          </td>
          <td class="text-left text-sm px-2">
              <input
              if.bind="!useAmount"
              type="number"
              min="1"
              max="100"
              value.two-way="asset.percentage"
              required
              class.bind="'daisy-input daisy-input-xs w-16 text-center' + (asset.percentageInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
              input.trigger="validatePercentage(asset)"
              />
              <div else>${asset.percentage}</div>
              <div if.bind="asset.percentageInvalid" class="text-red-500 text-xs mt-1">Invalid percentage</div>
          </td>
          <td class="text-left text-sm px-2">
              <input
              type="number"
              min="0"
              value.two-way="asset.amount"
              required
              class.bind="'daisy-input daisy-input-xs w-32 text-center' + (asset.amountInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
              input.trigger="validateAmount(asset)"
              />
              <div if.bind="asset.amountInvalid" class="text-red-500 text-xs mt-1">Invalid amount</div>
          </td>
          <td class="text-left text-sm px-2">${asset.currentPrice}</td>
          <td class="text-center text-sm px-2"><input type="checkbox" checked.bind="asset.limit" /></td>
          <td class="text-left text-sm px-2">
              <input
              if.bind="asset.limit"
              type="number"
              min="0"
              value.two-way="asset.LimitPrice"
              required
              class.bind="'daisy-input daisy-input-xs w-32 text-center' + (asset.LimitPriceInvalid ? ' daisy-input-error' : ' daisy-input-secondary')"
              input.trigger="validateLimitPrice(asset)"
              />
              <div else>---</div>
              <div if.bind="asset.LimitPriceInvalid" class="text-red-500 text-xs mt-1">Invalid limit order price</div>
          </td>
          <td class="text-left text-sm px-2">
              <div>
                ${(asset.limit ? asset.LimitPrice : asset.currentPrice) * asset.amount}
              </div>
          </td>
        </tr>
      </tbody>
    </table>
    
    <!-- ***** BUTTON LINKS SECTION ***** -->
    <div class="flex flex-col items-center justify-center mt-4 gap-2">
      <div class="flex flex-row gap-4">
        <div class="text-sm">Select 
          <span class="daisy-link daisy-link-primary hover:cursor-pointer"
            click.trigger="selectAll()">All</span>
          |
          <span class="daisy-link daisy-link-primary hover:cursor-pointer"
            click.trigger="selectNone()">None</span>
        </div>
      </div>
      <div class="flex flex-row gap-4">
        <div
          click.trigger="refresh()"
          class="flex daisy-link justify-center daisy-link-primary text-sm hover:cursor-pointer">
            <span class="whitespace-nowrap">Refresh Prices and Balances</span>
            <span if.bind="isRefreshing" class="flex items-center justify-center h-full ml-1" style="margin-left: 4px;">
              <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </span>
        </div>
      </div>
      <div class="flex flex-row gap-4 py-2">
        <div
          click.trigger="createOrders()"
          class.bind="'flex daisy-btn daisy-btn-outline daisy-btn-primary daisy-btn-sm' + (!hasSelection || hasInvalidSelection ? ' daisy-btn-disabled opacity-50 cursor-not-allowed' : '')"
          disabled.bind="!hasSelection || hasInvalidSelection">
          Place the ${selectedOrders.length} selected order<template if.bind="selectedOrders.length != 1">s</template>
        </div>
      </div>
      <!-- ***** HELP MESSAGES SECTION ***** -->
      <div class="text-yellow-500 text-xs mt-1">Orders will be executed in terms of "Coins to Buy/Sell". Is best to round it, by editing it.</div>
      <div class="text-yellow-500 text-xs mt-1">"$USD/Coin" is the current USD price of one coin. "Percent" is only to compute the default "Coins to Buy/Sell".</div>
      <div class="text-yellow-500 text-xs mt-1">Order history in Kraken can be found in KrakenPro => Trade => Open Orders, not in Kraken regular.</div>
    </div>

    <!-- Order Confirmation Modal -->
    <order-confirmation-modal
      pending-order.bind="pendingOrder"
      quote-coin.bind="quoteCoin"
      on-execute.bind="executeConfirmedOrder"
      on-cancel.bind="cancelOrder">
    </order-confirmation-modal>
  </div>
</template>
