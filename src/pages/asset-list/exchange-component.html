<template>
  <div class="tw-flex tw-flex-col tw-items-center tw-p-6">
    <!-- ***** TABLE SECTION ***** -->
     <div class="exchange-component">
      <table class="table">
        <tbody class="table-body">
          <tr repeat.for="asset of assets" class="table-row">
            <td class="cell-center">
              <fluent-checkbox checked.bind="asset.selected"></fluent-checkbox>
            </td>
            <td class="table-cell cell-left">${asset.exchange}</td>
            <td class="table-cell cell-left"><span class="coin-name">${asset.name}</span></td>
            <td class="table-cell cell-right">${asset.balance}</td>
            <td class="table-cell cell-center">
              <fluent-select
                value.two-way="asset.direction"
                style="width: 6rem;">
                <fluent-option value="buy">Buy</fluent-option>
                <fluent-option value="sell">Sell</fluent-option>
              </fluent-select>
            </td>
            <td class="table-cell cell-center">
              <fluent-text-field
                if.bind="!useAmount"
                type="number"
                min="1"
                max="100"
                value.two-way="asset.percentage"
                required
                appearance.bind="asset.percentageInvalid ? 'error' : 'outline'"
                style="width: 4rem; text-align: center; font-size: 12px;"
                input.trigger="validatePercentage(asset)">
              </fluent-text-field>
              <div else class="percentage-display">${asset.percentage}%</div>
              <div if.bind="asset.percentageInvalid" class="error-message">Invalid percentage</div>
            </td>
            <td class="table-cell cell-center">
              <fluent-text-field
                type="number"
                min="0"
                value.two-way="asset.amount"
                required
                appearance.bind="asset.amountInvalid ? 'error' : 'outline'"
                style="width: 8rem; text-align: center; font-size: 12px;"
                input.trigger="validateAmount(asset)">
              </fluent-text-field>
              <div if.bind="asset.amountInvalid" class="error-message">Invalid amount</div>
            </td>
            <td class="table-cell cell-right">${asset.currentPrice}</td>
            <td class="table-cell cell-center">
              <fluent-checkbox checked.bind="asset.limit"></fluent-checkbox>
            </td>
            <td class="table-cell cell-center">
              <fluent-text-field
                if.bind="asset.limit"
                type="number"
                min="0"
                value.two-way="asset.limitPrice"
                required
                appearance.bind="asset.LimitPriceInvalid ? 'error' : 'outline'"
                style="width: 8rem; text-align: center; font-size: 12px;"
                input.trigger="validateLimitPrice(asset)">
              </fluent-text-field>
              <div else class="placeholder-text">---</div>
              <div if.bind="asset.LimitPriceInvalid" class="error-message">Invalid limit order price</div>
            </td>
            <td class="table-cell cell-right-bold">
              ${(asset.limit ? asset.limitPrice : asset.currentPrice) * asset.amount}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- ***** BUTTON LINKS SECTION ***** -->
    <div class="tw-flex tw-items-center tw-justify-center tw-gap-0">
      <span class="tw-text-sm tw-font-medium tw-p-1">Select</span>
      <fluent-button appearance="stealth" class="tw-underline" style="--design-unit: 0px;" click.trigger="selectAll()">All</fluent-button>
      <fluent-button appearance="stealth" class="tw-underline" style="--design-unit: 0px;" click.trigger="selectNone()">None</fluent-button>
    </div>
    <div class="tw-flex tw-flex-col tw-items-center tw-justify-center tw-mt-4 tw-gap-2">
      <div class="tw-flex tw-flex-row tw-gap-4">
        <fluent-button
          appearance="stealth"
          click.trigger="refresh()"
          class="tw-flex tw-center tw-underline">
            <span class="tw-whitespace-nowrap">Refresh Prices and Balances</span>
            <span if.bind="isRefreshing" class="tw-flex tw-items-center tw-justify-center tw-h-full tw-ml-1" style="margin-left: 4px;">
              <svg class="tw-animate-spin tw-h-4 tw-w-4 tw-text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="tw-opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="tw-opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </span>
        </fluent-button>
        </div>
      </div>
      <div class="tw-flex tw-flex-row tw-gap-4 tw-py-2">
        <fluent-button
          click.trigger="createOrders()"
          appearance="accent"
          disabled.bind="!hasSelection || hasInvalidSelection"
          class="tw-flex tw-center">
          Place the ${selectedOrders.length} selected order<template if.bind="selectedOrders.length != 1">s</template>
        </fluent-button>
      </div>
      <!-- ***** HELP MESSAGES SECTION ***** -->
      <div class="tw-text-yellow-500 tw-text-sm tw-mt-1">Orders will be executed in terms of "Coins to Buy/Sell". Is best to round it, by editing it.</div>
      <div class="tw-text-yellow-500 tw-text-sm tw-mt-1">"$USD/Coin" is the current USD price of one coin. "Percent" is only to compute the default "Coins to Buy/Sell".</div>
      <div class="tw-text-yellow-500 tw-text-sm tw-mt-1">Order history in Kraken can be found in KrakenPro => Trade => Open Orders, not in Kraken regular.</div>
    </div>

    <!-- Order Confirmation Modal -->
    <order-confirmation-modal
      pending-order.bind="pendingOrder"
      quote-coin.bind="quoteCoin"
      on-execute.bind="executeConfirmedOrder.bind($this)"
      on-cancel.bind="cancelOrder.bind($this)">
    </order-confirmation-modal>
  </div>
</template>
