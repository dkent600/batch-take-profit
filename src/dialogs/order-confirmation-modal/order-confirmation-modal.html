<template>
<div class="order-confirmation-dialog" >
  <div class="tw-dialog-content tw-max-w-2xl tw-rounded-2xl tw-shadow-2xl tw-bg-white tw-border tw-border-gray-300 tw-px-8 tw-py-6 tw-space-y-6">

    <!-- Header -->
    <h3 class="tw-text-2xl tw-font-semibold tw-text-orange-600 tw-flex tw-items-center tw-gap-2">
      🚨 Confirm ${pendingOrder.direction.toUpperCase()} Order
    </h3>

    <!-- Alerts -->
    <div class="tw-space-y-4">
      <!-- High Value -->
      <div class="alert alert-error tw-p-4 tw-bg-red-50 tw-border tw-border-red-200 tw-rounded-lg tw-shadow-md" if.bind="needsSafetyCheck">
        <span class="tw-font-bold tw-text-red-800">HIGH VALUE ORDER DETECTED</span>
        <span class="tw-text-red-700">Estimated value: $${estimatedValue.toFixed(2)}</span>
      </div>

      <!-- Test Mode -->
      <div class="alert alert-info tw-p-4 tw-bg-blue-50 tw-border tw-border-blue-200 tw-rounded-lg" if.bind="isProduction">
        <span class="tw-font-bold tw-flex tw-items-center tw-gap-2 tw-text-blue-800">🚨 Production Mode 🚨</span>
        <span class="tw-text-blue-700">This order WILL be executed</span>
      </div>
      <div else class="alert alert-info tw-p-4 tw-bg-blue-50 tw-border tw-border-blue-200 tw-rounded-lg" if.bind="!isProduction">
        <span class="tw-font-bold tw-flex tw-items-center tw-gap-2 tw-text-blue-800">🧪 Test Mode 🧪</span>
        <span class="tw-text-blue-700">This order will be validated but NOT executed.</span>
      </div>
    </div>

    <!-- Order Details -->
    <div class="tw-grid tw-grid-cols-2 tw-gap-4 tw-bg-gray-100 tw-rounded-lg tw-p-5 tw-text-sm tw-shadow-inner">
      <div class="tw-font-semibold">Asset:</div>
      <div class="tw-font-mono tw-text-blue-600">${pendingOrder.name}</div>

      <div class="tw-font-semibold">Type:</div>
      <div>
        <span class="tw-badge tw-px-3 tw-py-1 tw-rounded-full tw-text-sm tw-font-medium" 
              class.bind="pendingOrder.limit ? 'tw-bg-purple-100 tw-text-purple-800' : 'tw-bg-green-100 tw-text-green-800'">
          ${pendingOrder.limit ? 'LIMIT' : 'MARKET'}
        </span>
      </div>

      <div class="tw-font-semibold">Amount:</div>
      <div class="tw-font-mono">${pendingOrder.amount.toFixed(8)} ${pendingOrder.name}</div>

      <div class="tw-font-semibold" if.bind="pendingOrder.limit">Price:</div>
      <div class="tw-font-mono" if.bind="pendingOrder.limit">${pendingOrder.LimitPrice} ${quoteCoin}</div>

      <div class="tw-font-semibold">Balance:</div>
      <div class="tw-font-mono">${pendingOrder.balance.toFixed(8)} ${pendingOrder.name}</div>

      <div class="tw-font-semibold">Percentage:</div>
      <div class="tw-font-mono">${pendingOrder.percentage.toFixed(2)}%</div>

      <div class="tw-font-semibold">${pendingOrder.direction === 'sell' ? 'Estimated Revenue:' : 'Estimated Cost:'}</div>
      <div class="tw-font-mono tw-font-bold tw-text-lg" class.bind="needsSafetyCheck ? 'tw-text-red-600' : 'tw-text-green-600'">
        $${estimatedValue.toFixed(2)} ${quoteCoin}
      </div>
    </div>

    <!-- Safety Confirmation (if needed) -->
    <div class="tw-space-y-2" if.bind="needsSafetyCheck">
      <div class="alert tw-p-4 tw-bg-yellow-50 tw-border tw-border-yellow-200 tw-rounded-lg tw-text-sm">
        <span class="tw-font-bold tw-text-yellow-800">Final Safety Check</span>
        <span class="tw-text-yellow-700">Type: 
          <code class="tw-bg-gray-800 tw-text-white tw-px-2 tw-py-1 tw-rounded tw-font-mono tw-text-sm tw-tracking-wider">
            ${confirmationText}
          </code>
        </span>
      </div>

      <fluent-text-field 
        type="text" 
        placeholder="Type the confirmation text..." 
        class="tw-w-full tw-text-center"
        appearance.bind="safetyConfirmationInput === confirmationText ? 'filled' : 'outline'"
        value.two-way="safetyConfirmationInput"
      ></fluent-text-field>

      <p class="tw-text-center tw-text-sm tw-font-medium" 
         class.bind="safetyConfirmationInput === confirmationText ? 'tw-text-green-600' : 'tw-text-red-600'">
        ${safetyConfirmationInput === confirmationText ? '✅ Safety check passed!' : '⚠️ Text does not match.'}
      </p>
    </div>

    <!-- Warning Footer -->
    <div class="alert tw-p-4 tw-bg-yellow-50 tw-border tw-border-yellow-200 tw-rounded-lg tw-text-sm">
      <span class="tw-font-bold tw-text-yellow-800">This action cannot be undone.</span>
      <span class="tw-text-yellow-700">Please review all details before continuing.</span>
    </div>

    <!-- Actions -->
    <div class="tw-flex tw-gap-4 tw-justify-end tw-pt-4">
      <fluent-button 
        appearance="accent"
        class="tw-flex-1"
        click.trigger="executeOrder()"
        disabled.bind="needsSafetyCheck && safetyConfirmationInput !== confirmationText"
      >
        🚀 Execute ${pendingOrder ? pendingOrder.direction.toUpperCase() : ''} Order
      </fluent-button>
      <fluent-button 
        appearance="outline"
        class="tw-flex-1"
        click.trigger="cancel()"
      >
        ❌ Cancel
      </fluent-button>
    </div>
  </div>
</div>
</template>
